<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <div class="search-container">
        <label for="buscador">Buscar:</label>
        <input type="text" id="buscador" placeholder="Escribí el nombre de la comida...">
      </div>
      <div class="filters-container">
        <div>
          <label for="filtroCategoria">Categoría:</label>
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
            <option value="Parrilla">Parrilla</option>
            <option value="Horno">Horno</option>
            <option value="Guiso">Guiso</option>
            <option value="Frito">Frito</option>
          </select>
        </div>

        <div>
          <label for="filtroProvincia">Provincia:</label>
          <select id="filtroProvincia">
            <option value="">Todas las provincias</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Tucumán">Tucumán</option>
            <option value="Salta">Salta</option>
            <option value="Jujuy">Jujuy</option>
            <option value="Córdoba">Córdoba</option>
            <option value="Santa Fe">Santa Fe</option>
            <option value="Entre Ríos">Entre Ríos</option>
          </select>
        </div>
      </div>
    </header>

    <main class="comida-container" id="comidaContainer">
    </main>     

    <section class="addFood">
      <form id="agregarComida">
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre de la comida" required>
      
        <label for="categoria">Categoría</label>
        <input type="text" id="categoria" name="categoria" placeholder="Categoría de la comida">
      
        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" name="provincia" placeholder="Provincia de la comida">
      
        <label for="ingredientes">Ingredientes</label>
        <input type="text" id="ingredientes" name="ingredientes" placeholder="Ingredientes de la Comida">
      
        <button type="submit">Agregar Comida</button>
      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
